<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Error del servidor · Gestión de cuestionarios</title>
  <style>
    /* Standalone on purpose: this page is rendered when something is already broken,
       so it cannot rely on the template base, on the context processors or on CSS. */
    body {
      margin: 0;
      padding: 48px 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: #1b2233;
      background: #f4f6fb;
    }
    main { max-width: 640px; margin: 0 auto; background: #fff; border: 1px solid #c9d2e0; border-radius: 12px; padding: 32px; }
    h1 { font-size: 24px; margin: 0 0 16px; }
    p { margin: 0 0 16px; }
    a { color: #1d4ed8; }
  </style>
</head>
<body>
  <main>
    <h1>Error del servidor</h1>
    <p>Ha ocurrido un problema al procesar la página. Vuelve a intentarlo en unos minutos.</p>
    <p><a href="/">Ir al panel de control</a></p>
  </main>
</body>
</html>
