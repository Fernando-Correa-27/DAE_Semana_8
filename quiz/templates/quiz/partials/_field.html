{% load quiz_tags %}
<div class="field{% if field.errors %} field--invalid{% endif %}">
  <label class="field__label" for="{{ field.id_for_label }}">{{ field.label }}</label>
  {% render_field field %}
  {% if field.help_text %}
    <p class="field__help" id="{{ field.id_for_label }}-help">{{ field.help_text }}</p>
  {% endif %}
  {% if field.errors %}
    <ul class="field__errors" id="{{ field.id_for_label }}-error">
      {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
    </ul>
  {% endif %}
</div>
